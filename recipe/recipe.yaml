schema_version: 1

context:
  name: stealthkit
  version: "1.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/stealthkit-${{ version }}.tar.gz
  sha256: 8f6d658cce5e305e2acc95845c8f6b08b8323410ad8c93358f9a456ee8f310cd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - curl-cffi ==0.10.0
    - fake-useragent ==2.0.3

tests:
  - python:
      imports:
        - stealthkit
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A stealthy HTTP request library with rotating user agents and proxy support
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/theonlyanil/stealthkit

extra:
  recipe-maintainers:
    - thewchan
